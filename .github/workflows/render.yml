name: Render Boring Planet Reel

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '.github/workflows/render.yml'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome headless dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm-dev \
            libasound2t64 fonts-liberation libxss1 libxshmfence1

      - name: Install dependencies
        run: npm ci

      - name: Render video
        run: npx remotion render src/index.ts BoringPlanet out/boring-planet.mp4

      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: boring-planet-reel
          path: out/boring-planet.mp4
          retention-days: 14
